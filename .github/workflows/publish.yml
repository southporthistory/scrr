name: Build and publish archive
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [catalog_changed]
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: content/thumbnails
          key: thumbnails-${{ hashFiles('content/fixture/catalog.json') }}
          restore-keys: thumbnails-
      - run: npm run check
        env:
          CATALOG_SOURCE: sheet
          SHEET_ITEMS_CSV_URL: ${{ vars.SHEET_ITEMS_CSV_URL }}
          SHEET_COLLECTIONS_CSV_URL: ${{ vars.SHEET_COLLECTIONS_CSV_URL }}
          FETCH_THUMBNAILS: "false"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
